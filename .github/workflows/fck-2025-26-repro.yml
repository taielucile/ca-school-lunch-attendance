name: FCK 2025-26 full-data reproducibility

on:
  pull_request:
    paths:
      - '.github/workflows/fck-2025-26-repro.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'results/2025_26/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout denominator repository
        uses: actions/checkout@v4
      - name: Checkout shared FCK source repository
        uses: actions/checkout@v4
        with:
          repository: whippedfruit/Feed-California-Kinders
          path: team
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python workbook dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Acquire 2025-26 CDE raw TSVs and confirm exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl -fL --retry 3 --connect-timeout 40 -o data/raw/cdenroll2526.txt \
            https://www3.cde.ca.gov/demo-downloads/census/cdenroll2526.txt
          curl -fL --retry 3 --connect-timeout 40 -o data/raw/absenteeismreason26.txt \
            https://www3.cde.ca.gov/demo-downloads/attendance/absenteeismreason26.txt
          echo '10d074101bc1aa3e9dc7433200a3825e430e261b1382e5c5f3102d989f4fa149  data/raw/cdenroll2526.txt' | sha256sum -c -
          echo '59458d5a12a5c5e104633683f50c741e8d3a7e1e477fd12cc69192aee5581c0a  data/raw/absenteeismreason26.txt' | sha256sum -c -
      - name: Execute unit and data-integrity tests
        run: python -m unittest discover -s tests -p 'test_*2526.py' -v
      - name: Rebuild every district from official 2025-26 CDE sources
        run: |
          mkdir -p output/full
          python scripts/build_denominators_2526.py data/raw/cdenroll2526.txt data/raw/absenteeismreason26.txt output/full > output/full/rebuild_log.json
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('output/full/school_denominator_proxies_2025_26.csv')
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          print('Full 2025-26 CDE output: school rows',len(rows), 'usable combined TK/K', sum(bool(r['estimated_tk_k_ada']) for r in rows))
          PY
      - name: Convert complete Lodi school extract to grade sensitivity rows
        run: |
          python scripts/reshape_district_denominators_2526.py \
            output/full/district_39_68585_school_proxies_2025_26.csv \
            output/full/lodi_complete_school_grade_proxies_2025_26.csv
      - name: Commit corrected Lodi and statewide public-derived extract to review branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == '2026-10-district-denominator-extracts' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const targets = {
              'results/2025_26/lodi_unified_school_denominator_proxies.csv':
                'output/full/district_39_68585_school_proxies_2025_26.csv',
              'results/2025_26/lodi_unified_school_grade_proxies.csv':
                'output/full/lodi_complete_school_grade_proxies_2025_26.csv',
              'results/2025_26/statewide_school_denominator_proxies.csv':
                'output/full/school_denominator_proxies_2025_26.csv',
              'results/2025_26/all_district_quality_summary.csv':
                'output/full/district_quality_summary_2025_26.csv'
            };
            const branch = context.payload.pull_request.head.ref;
            for (const [path, local] of Object.entries(targets)) {
              let sha;
              try {
                const got = await github.rest.repos.getContent({
                  ...context.repo,path,ref:branch
                });
                sha = got.data.sha;
              } catch(e) {
                if (e.status !== 404) throw e;
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,path,branch,sha,
                message:'Rebuild audited CDE 2025-26 outputs from full official source: '+path,
                content:fs.readFileSync(local).toString('base64')
              });
              core.info('Wrote verified data: '+path);
            }
      - name: Compare six published district extracts to regenerated results
        continue-on-error: true
        run: python scripts/check_2526_rebuild.py . output/full
      - name: Inspect original FNS10 workbook and public CBEDS fields
        run: |
          python scripts/inspect_fns10_sources.py \
            "team/Statewide/DR-20260729-160143 EXT_PRA_Penner_SNP_FNS10Meals.xlsx" \
            "team/Statewide/CA_sites_cbedsora24b.txt" \
            output/source_schema.json
      - name: Execute statewide 2024-25 FNS10-CBEDS source audit
        run: |
          python scripts/run_fns10_source_audit.py \
            "team/Statewide/DR-20260729-160143 EXT_PRA_Penner_SNP_FNS10Meals.xlsx" \
            "team/Statewide/CA_sites_cbedsora24b.txt" \
            output/fns10 > output/fns10_audit_stdout.json
          cat output/fns10/fns10_audit_summary.json
      - name: Publish traceable FNS10 matching review outputs to PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == '2026-10-district-denominator-extracts' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const targets = {
              'results/2024_25/fns10_audit_summary.json':'output/fns10/fns10_audit_summary.json',
              'results/2024_25/fns10_all_site_link_candidates_2024_25.csv':'output/fns10/fns10_all_site_link_candidates_2024_25.csv',
              'results/2024_25/fns10_unmatched_priority_250.csv':'output/fns10/fns10_unmatched_priority_250.csv',
              'results/2024_25/cbeds_ambiguous_keys.csv':'output/fns10/cbeds_ambiguous_keys.csv'
            };
            const branch=context.payload.pull_request.head.ref;
            for (const [path,local] of Object.entries(targets)) {
              let sha;
              try {
                const got=await github.rest.repos.getContent({...context.repo,path,ref:branch});
                sha=got.data.sha;
              } catch(e) { if(e.status!==404)throw e; }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,path,branch,sha,
                message:'Record FNS10 source-backed review output: '+path,
                content:fs.readFileSync(local).toString('base64')
              });
              core.info('Published '+path);
            }
      - name: Upload full FNS10 site linkage audit files
        uses: actions/upload-artifact@v4
        with:
          name: fck-fns10-2024-25-full-linkage-audit
          path: output/fns10/
          retention-days: 30
          if-no-files-found: error
      - name: Copy Ventura source workbook to artifact-safe filename
        run: |
          mkdir -p output/source_safe
          cp "team/Ventura Unified/extracted data/Ventura 8:13:2025 - 6:4:2026 ADA clear_copy.xlsx" output/source_safe/ventura_ada_2025_26.xlsx
      - name: Archive exact public research sources for byte-level local verification
        uses: actions/upload-artifact@v4
        with:
          name: fck-source-inputs-2025-26
          path: |
            data/raw/cdenroll2526.txt
            data/raw/absenteeismreason26.txt
            team/Statewide/DR-20260729-160143 EXT_PRA_Penner_SNP_FNS10Meals.xlsx
            team/Statewide/CA_sites_cbedsora24b.txt
            output/source_safe/ventura_ada_2025_26.xlsx
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
      - name: Install R and Angela's required packages
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            r-base-core r-cran-readxl r-cran-dplyr r-cran-stringr r-cran-purrr r-cran-here r-cran-ggplot2
      - name: Download checksum-verified 2024-25 CDE sources for legacy R pipeline
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 40 -o data/raw/cdenroll2425.txt \
            https://www3.cde.ca.gov/demo-downloads/census/cdenroll2425.txt
          curl -fL --retry 3 --connect-timeout 40 -o data/raw/absenteeismreason25-v2.txt \
            https://www3.cde.ca.gov/demo-downloads/attendance/absenteeismreason25-v2.txt
          cp "team/Statewide/CA_sites_cbedsora24b.txt" data/raw/cbedsora24b.txt
          cp "team/Irvine/extracted data/irvine_k_pk_attendance_2025_11_03_07.csv" data/raw/
          cp "team/Lodi/extracted data/lodi_kindergarten_enrollment_measures_2025_26.csv" data/raw/
          echo 'ff65bf6e2c4a0928dc1533106af29716a2cefb71e2e521e5c0e174fa737f8bbc  data/raw/cdenroll2425.txt' | sha256sum -c -
          echo '07a12d7f3b20b19ba02c6363f87becb5b3c03ee1e87c0aca7ddf5012c72a6bd7  data/raw/absenteeismreason25-v2.txt' | sha256sum -c -
          echo 'cda8c7e3b0c573506acdda567d83494e93d19ec9ff7a4fd1caa95e08c09faa2f  data/raw/cbedsora24b.txt' | sha256sum -c -
      - name: Run complete 2024-25 R pipeline and original regression suite
        run: |
          mkdir -p output/legacy-r
          Rscript RUN_ALL.R > output/legacy-r/RUN_ALL.log 2>&1
          Rscript tests/test_pipeline.R > output/legacy-r/test_pipeline.log 2>&1
          tail -n 12 output/legacy-r/test_pipeline.log
      - name: Execute Angela original R scripts and validate proxy import bridge
        run: |
          Rscript tests/verify_angela_ventura.R "$PWD/team" \
            "$PWD/results/2025_26/ventura_unified_school_grade_proxies.csv" \
            "$PWD/output/angela"
      - name: Upload source schema and denominator rebuild as inspectable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fck-full-data-provenance
          path: |
            output/source_schema.json
            output/full/district_quality_summary_2025_26.csv
            output/full/source_manifest.json
            output/full/school_denominator_proxies_2025_26.csv
            output/full/district_39_68585_school_proxies_2025_26.csv
            output/legacy-r/RUN_ALL.log
            output/legacy-r/test_pipeline.log
            output/angela/angela_integration_summary.csv
            output/angela/ventura_angela_bridge_proxies_not_measured.csv
          if-no-files-found: warn
          retention-days: 30
