name: Research integrity checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required project files
        shell: bash
        run: |
          test -f RUN_ALL.R
          test -f README.md
          test -f CITATION.cff
          test -f docs/decisions.md
          test -f docs/sources.md
      - name: Prevent committed raw data
        shell: bash
        run: |
          tracked="$(git ls-files 'data/raw/*' | grep -vE '(^|/)(README\.md|\.gitkeep)$' || true)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "Raw source data must not be committed."
            exit 1
          fi
